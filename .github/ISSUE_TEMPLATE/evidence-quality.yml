name: Jev recommendation quality
description: Report a Jev recommendation that did not address the repository question.
title: "[Recommendation]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, private source code, or complete diagnostic bundles. Share only a sanitized question and details that are safe to disclose.
  - type: input
    id: versions
    attributes:
      label: JevNexus, GitNexus, and agent host versions
      description: Include versions when known.
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Sanitized repository question
      description: Remove project or customer names that should remain private.
    validations:
      required: true
  - type: input
    id: decision
    attributes:
      label: Jev recommendation
      description: Share Jev's choice or a short sanitized summary. Omit private repository details.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: What was wrong or missing?
      description: Explain what you expected and why the recommendation did not help. Do not paste source code or a full evidence bundle.
    validations:
      required: true
